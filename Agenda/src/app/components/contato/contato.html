<div class="container mt-4">

  <form [formGroup]="formContato">

    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input
        type="text"
        class="form-control"
        formControlName="nome">
    </div>

    <div class="mb-3">
      <label class="form-label">Telefone</label>
      <input
        type="text"
        class="form-control"
        formControlName="telefone">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input
        type="email"
        class="form-control"
        formControlName="email">
    </div>

    <div class="mb-3">
      <label class="form-label">Aniversário</label>
      <input
        type="date"
        class="form-control"
        formControlName="aniversario">
    </div>

    <div class="mb-3">
      <label class="form-label">Tipo</label>

      <select
        class="form-select"
        formControlName="tipo">

        <option value="">Selecione</option>

        @for(tipo of tipos; track tipo){
          <option [value]="tipo">
            {{ tipo }}
          </option>
        }

      </select>
    </div>

    <button
      type="button"
      class="btn btn-primary"
      [disabled]="formContato.invalid"
      (click)="adicionarContato()">

      Adicionar Contato

    </button>

  </form>

</div>
