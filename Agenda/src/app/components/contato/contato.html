<div class="container mt-4">

  <h2 class="text-center mb-4">
    Agenda de Contatos
  </h2>

  <form [formGroup]="formContato">

    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input
        type="text"
        class="form-control"
        formControlName="nome">
    </div>

    <div class="mb-3">
      <label class="form-label">Telefone</label>
      <input
        type="text"
        class="form-control"
        formControlName="telefone">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input
        type="email"
        class="form-control"
        formControlName="email">
    </div>

    <div class="mb-3">
      <label class="form-label">Aniversário</label>
      <input
        type="date"
        class="form-control"
        formControlName="aniversario">
    </div>

    <div class="mb-3">
      <label class="form-label">Tipo</label>

      <select
        class="form-select"
        formControlName="tipo">

        <option value="">Selecione</option>

        <option
          *ngFor="let tipo of tipos"
          [value]="tipo">

          {{ tipo }}

        </option>

      </select>
    </div>

    <button
      type="button"
      class="btn btn-primary"
      [disabled]="formContato.invalid"
      (click)="adicionarContato()">

      Adicionar Contato

    </button>

  </form>

  <hr>

  <h3>Contatos Cadastrados</h3>

  <table class="table table-striped" *ngIf="contatos.length > 0">

    <thead>
      <tr>
        <th>Nome</th>
        <th>Telefone</th>
        <th>Email</th>
        <th>Aniversário</th>
        <th>Tipo</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let contato of contatos">

        <td>{{ contato.getNome() }}</td>
        <td>{{ contato.getTelefone() }}</td>
        <td>{{ contato.getEmail() }}</td>
        <td>{{ contato.getAniversario() }}</td>
        <td>{{ contato.getTipo() }}</td>

      </tr>

    </tbody>

  </table>

</div>
